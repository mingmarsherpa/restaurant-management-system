[project]
name = "restaurant-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "mingmarsherpa", email = "mtashi098@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
